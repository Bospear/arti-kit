name: Build & Deploy Artikit

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t artikit:latest .

      - name: Save Docker image to tar
        run: docker save artikit:latest | gzip > artikit.tar.gz

      - name: Copy image to server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "$SERVER_PASSWORD" \
            scp -o StrictHostKeyChecking=no \
            artikit.tar.gz \
            "${SERVER_USERNAME}@storybook.bospear.com:/tmp/artikit.tar.gz"
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: storybook.bospear.com
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: SERVER_PASSWORD
          request_pty: true
          script: |
            # Cache sudo credentials (non-interactive; needs SERVER_PASSWORD)
            echo "$SERVER_PASSWORD" | sudo -S -v

            sudo docker load -i /tmp/artikit.tar.gz
            rm -f /tmp/artikit.tar.gz

            sudo docker stop artikit 2>/dev/null || true
            sudo docker rm artikit 2>/dev/null || true
            sudo docker run -d \
              --name artikit \
              --restart unless-stopped \
              -p 127.0.0.1:6006:80 \
              artikit:latest

            sudo docker network create caddy-net 2>/dev/null || true
            sudo docker network connect caddy-net artikit 2>/dev/null || true

            sudo mkdir -p /opt/caddy
            sudo tee /opt/caddy/Caddyfile > /dev/null << 'CADDYEOF'
            storybook.bospear.com {
              reverse_proxy artikit:80
            }
            CADDYEOF
            sudo sed -i 's/^            //' /opt/caddy/Caddyfile

            if sudo docker ps -a --format '{{.Names}}' | grep -q '^caddy$'; then
              sudo docker restart caddy
            else
              sudo docker run -d \
                --name caddy \
                --restart unless-stopped \
                --network caddy-net \
                -p 80:80 \
                -p 443:443 \
                -v /opt/caddy/Caddyfile:/etc/caddy/Caddyfile:ro \
                -v caddy_data:/data \
                -v caddy_config:/config \
                caddy:2-alpine
            fi

            sudo docker image prune -f
