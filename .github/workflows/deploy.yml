name: Build & Deploy Artikit

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t artikit:latest .

      - name: Save Docker image to tar
        run: docker save artikit:latest | gzip > artikit.tar.gz

      - name: Copy image to server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "$SERVER_PASSWORD" \
            scp -o StrictHostKeyChecking=no \
            artikit.tar.gz \
            "${SERVER_USERNAME}@storybook.bospear.com:/tmp/artikit.tar.gz"
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: storybook.bospear.com
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: SERVER_PASSWORD
          request_pty: true
          script: |
            # Cache sudo credentials (non-interactive; needs SERVER_PASSWORD)
            echo "$SERVER_PASSWORD" | sudo -S -v

            sudo docker load -i /tmp/artikit.tar.gz
            rm -f /tmp/artikit.tar.gz

            sudo docker stop artikit 2>/dev/null || true
            sudo docker rm artikit 2>/dev/null || true
            sudo docker run -d \
              --name artikit \
              --restart unless-stopped \
              -p 127.0.0.1:6006:80 \
              artikit:latest

            sudo docker network create caddy-net 2>/dev/null || true
            sudo docker network connect caddy-net artikit 2>/dev/null || true

            sudo mkdir -p /opt/caddy
            if [ ! -f /opt/caddy/Caddyfile ]; then
              echo | sudo tee /opt/caddy/Caddyfile >/dev/null
            fi

            # Replace only this site's block so other vhosts stay in the Caddyfile.
            tmp=$(mktemp)
            sudo awk -v host="storybook.bospear.com" '
              function delta(s,    i, n, ch) {
                n = 0
                for (i = 1; i <= length(s); i++) {
                  ch = substr(s, i, 1)
                  if (ch == "{") n++
                  else if (ch == "}") n--
                }
                return n
              }
              BEGIN { skip = 0; depth = 0 }
              {
                trimmed = $0
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", trimmed)
                if (!skip && trimmed == host " {") {
                  skip = 1
                  depth = delta($0)
                  next
                }
                if (skip) {
                  depth += delta($0)
                  if (depth <= 0) skip = 0
                  next
                }
                print
              }
            ' /opt/caddy/Caddyfile > "$tmp"
            printf '\n%s {\n\treverse_proxy artikit:80\n}\n' \
              "storybook.bospear.com" >> "$tmp"
            sudo tee /opt/caddy/Caddyfile >/dev/null < "$tmp"
            rm -f "$tmp"

            if sudo docker ps -a --format '{{.Names}}' | grep -q '^caddy$'; then
              sudo docker restart caddy
            else
              sudo docker run -d \
                --name caddy \
                --restart unless-stopped \
                --network caddy-net \
                -p 80:80 \
                -p 443:443 \
                -v /opt/caddy/Caddyfile:/etc/caddy/Caddyfile:ro \
                -v caddy_data:/data \
                -v caddy_config:/config \
                caddy:2-alpine
            fi

            sudo docker image prune -f
